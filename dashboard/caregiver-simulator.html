<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FirstHour — Caregiver Simulator</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #171c24; --line: #273041;
      --text: #e6edf3; --dim: #93a1b5; --accent: #4f9cff; --ok: #3fb950; --warn: #f0a33e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
      display: flex; justify-content: center; padding: 24px 16px;
    }
    .phone { width: 100%; max-width: 420px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
    input, textarea, button {
      width: 100%; font: inherit; color: var(--text);
      background: #0d1117; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    textarea { resize: vertical; min-height: 64px; }
    .row { margin-bottom: 12px; }
    button { background: var(--accent); border: none; color: #04101f; font-weight: 600; cursor: pointer; }
    button.secondary { background: #0d1117; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
    .quick { display: flex; gap: 8px; margin-bottom: 12px; }
    .quick button { font-size: 13px; padding: 8px; }
    .log { font-size: 14px; }
    .msg { padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 85%; }
    .msg.in { background: #10243a; align-self: flex-end; margin-left: auto; }
    .msg.out { background: #1b222c; border: 1px solid var(--line); white-space: pre-wrap; }
    .stream { display: flex; flex-direction: column; }
    .status { font-size: 12px; color: var(--dim); margin-top: 8px; min-height: 16px; }
    .status.ok { color: var(--ok); } .status.err { color: var(--warn); }
  </style>
</head>
<body>
  <div class="phone">
    <h1>Caregiver Simulator</h1>
    <p class="sub">Stands in for the caregiver's phone. Replies POST to the
      same <code>/comms/inbound</code> endpoint Photon uses, so the demo
      works even before the carrier link is live.</p>

    <div class="panel">
      <div class="row">
        <label for="backend">Backend</label>
        <input id="backend" value="http://localhost:8000" />
      </div>
      <div class="row">
        <label for="from">Send as (phone)</label>
        <input id="from" value="+13105550101" />
      </div>
      <div class="quick">
        <button class="secondary" data-fill="UNLOCK 4821">UNLOCK 4821</button>
        <button class="secondary" data-fill="On my way, 5 minutes.">"On my way"</button>
      </div>
      <div class="row">
        <label for="body">Reply text</label>
        <textarea id="body" placeholder="UNLOCK 4821  — or a message to read aloud"></textarea>
      </div>
      <button id="send">Send reply</button>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <label>Conversation</label>
      <div id="log" class="log stream"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const log = $("log");

    function add(kind, text) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    document.querySelectorAll("[data-fill]").forEach((b) => {
      b.addEventListener("click", () => { $("body").value = b.dataset.fill; });
    });

    $("send").addEventListener("click", async () => {
      const backend = $("backend").value.replace(/\/$/, "");
      const from = $("from").value.trim();
      const body = $("body").value.trim();
      const status = $("status");
      if (!body) { status.textContent = "Type a reply first."; status.className = "status err"; return; }

      add("in", body);
      status.textContent = "Sending…"; status.className = "status";
      try {
        const resp = await fetch(backend + "/comms/inbound", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ from, body }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || resp.status);
        status.textContent = "Delivered (" + (data.kind || "ok") + ")";
        status.className = "status ok";
        if (data.reply) add("out", data.reply);
      } catch (e) {
        status.textContent = "Failed: " + e.message + " (is the backend running?)";
        status.className = "status err";
      }
      $("body").value = "";
    });

    // Optional: show outbound alerts live if the backend exposes a WS.
    try {
      const ws = new WebSocket((location.origin.replace(/^http/, "ws")) + "/ws");
      ws.onmessage = (ev) => {
        try {
          const m = JSON.parse(ev.data);
          if (m.type === "message_out" && m.body) add("out", m.body);
        } catch (_) {}
      };
      ws.onerror = () => {};
    } catch (_) {}
  </script>
</body>
</html>
