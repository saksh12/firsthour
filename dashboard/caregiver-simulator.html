<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FirstHour — Caregiver Simulator</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #171c24; --line: #273041;
      --text: #e6edf3; --dim: #93a1b5; --accent: #4f9cff; --ok: #3fb950; --warn: #f0a33e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
      display: flex; justify-content: center; padding: 24px 16px;
    }
    .phone { width: 100%; max-width: 420px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
    input, textarea, button {
      width: 100%; font: inherit; color: var(--text);
      background: #0d1117; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    textarea { resize: vertical; min-height: 64px; }
    .row { margin-bottom: 12px; }
    button { background: var(--accent); border: none; color: #04101f; font-weight: 600; cursor: pointer; }
    button.secondary { background: #0d1117; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
    .quick { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .quick button { font-size: 13px; padding: 8px; flex: 1 1 30%; }
    button:disabled { opacity: .5; cursor: default; }
    .log { font-size: 14px; }
    .msg { padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 85%; }
    .msg.in { background: #10243a; align-self: flex-end; margin-left: auto; }
    .msg.out { background: #1b222c; border: 1px solid var(--line); white-space: pre-wrap; }
    .stream { display: flex; flex-direction: column; }
    .status { font-size: 12px; color: var(--dim); margin-top: 8px; min-height: 16px; }
    .status.ok { color: var(--ok); } .status.err { color: var(--warn); }
  </style>
</head>
<body>
  <div class="phone">
    <h1>Caregiver Simulator</h1>
    <p class="sub">Stands in for the caregiver's phone while <code>STUB_PHOTON=1</code>.
      Alerts come from the backend's stub inbox; replies POST to the same
      <code>/comms/inbound</code> endpoint the Photon gateway uses.</p>

    <div class="panel">
      <div class="row">
        <label for="backend">Backend</label>
        <input id="backend" />
      </div>
      <div class="row">
        <label for="from">Send as (phone)</label>
        <input id="from" value="+13105550101" />
      </div>
      <div class="quick">
        <button class="secondary" id="fill-unlock" disabled>UNLOCK (code comes after ON MY WAY)</button>
        <button class="secondary" data-fill="On my way, 5 minutes.">"On my way"</button>
        <button class="secondary" id="as-stranger">Be a stranger</button>
      </div>
      <div class="row">
        <label for="body">Reply text</label>
        <textarea id="body" placeholder="UNLOCK 1234, or a message to read aloud"></textarea>
      </div>
      <button id="send">Send reply</button>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <label>Conversation</label>
      <div id="log" class="log stream"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    $("backend").value = params.get("backend") || "http://localhost:8000";
    const backend = () => $("backend").value.replace(/\/$/, "");
    const seen = new Set();
    let code = null;

    function add(kind, text) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      $("log").appendChild(el);
      el.scrollIntoView({ block: "end" });
    }

    function setStatus(text, cls) {
      $("status").textContent = text;
      $("status").className = "status " + (cls || "");
    }

    // The stub inbox is the phone's inbox: the alert, then the door code once they say they're coming.
    // It 404s when STUB_PHOTON=0, because then the code only goes to the real phone.
    async function pollInbox() {
      try {
        const r = await fetch(backend() + "/comms/stub/outbox");
        if (r.status === 404) { setStatus("STUB_PHOTON=0: alerts go to the real phone.", "err"); return; }
        const { messages } = await r.json();
        for (const m of messages) {
          const key = m.incident_id + ":" + m.ts;
          if (seen.has(key)) continue;
          seen.add(key);
          add("out", m.text);
          const found = /UNLOCK (\d{4})/.exec(m.text);
          if (found) {
            code = found[1];
            $("fill-unlock").textContent = "UNLOCK " + code;
            $("fill-unlock").disabled = false;
          }
        }
      } catch (_) { /* backend not up yet; keep polling */ }
    }

    document.querySelectorAll("[data-fill]").forEach((b) => {
      b.addEventListener("click", () => { $("body").value = b.dataset.fill; });
    });
    $("fill-unlock").addEventListener("click", () => { if (code) $("body").value = "UNLOCK " + code; });
    $("as-stranger").addEventListener("click", () => { $("from").value = "+13105559999"; });

    $("send").addEventListener("click", async () => {
      const sender = $("from").value.trim();
      const text = $("body").value.trim();
      if (!text) { setStatus("Type a reply first.", "err"); return; }
      add("in", text);
      $("body").value = "";
      setStatus("Sending…");
      try {
        const resp = await fetch(backend() + "/comms/inbound", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender, text }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || resp.status);
        if (data.type === "unlock_attempt") {
          setStatus(data.allowed ? "Door unlock granted" : "Unlock refused: " + data.reason, data.allowed ? "ok" : "err");
        } else {
          setStatus(data.accepted ? "Read aloud to her" : "Not delivered: " + data.reason, data.accepted ? "ok" : "err");
        }
      } catch (e) {
        setStatus("Failed: " + e.message + " (is the backend running, with this page's origin in CORS_ORIGINS?)", "err");
      }
    });

    pollInbox();
    setInterval(pollInbox, 1000);
  </script>
</body>
</html>
